name: Automated CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Run Verification
        run: |
          npm ci --omit=dev
          node -c server.js

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting Automated Deployment to AWS EC2..."
            
            # Locate active backend repository directory
            TARGET_DIR=""
            for dir in "$HOME/field-Backend-both-monitor-app" "$HOME/backend" "$HOME/CRM-B" "$HOME/field-App" /var/www/*/kisanteamapp.online; do
              if [ -f "$dir/server.js" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR=$(find "$HOME" -maxdepth 3 -name "server.js" 2>/dev/null | head -n 1 | xargs dirname)
            fi

            echo "📂 Target directory found: $TARGET_DIR"
            if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
              echo "❌ ERROR: Target directory with server.js not found!"
              exit 1
            fi

            cd "$TARGET_DIR"
            echo "=== UPDATING REPOSITORY ==="
            git fetch origin main
            git reset --hard origin/main
            npm install --omit=dev

            echo "=== STARTING / RESTARTING PM2 BACKEND ==="
            pm2 delete trackpro-api 2>/dev/null || true
            pm2 delete kisanconnect-backend 2>/dev/null || true
            pm2 restart field-App-backend || pm2 restart 0 || pm2 start server.js --name "field-App-backend"
            pm2 save --force

            echo "=== VERIFYING PM2 STATUS ==="
            pm2 list
            echo "✅ Deployment Successful! Server is active on port 5000."
