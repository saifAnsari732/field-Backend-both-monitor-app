name: Automated CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Run Verification
        run: |
          npm ci --omit=dev
          node -c server.js

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting Automated Deployment & Rogue Process Purge..."
            echo "=== CURRENT PM2 PROCESSES ==="
            pm2 list || true

            echo "=== RUNNING NODE PROCESSES ==="
            ps aux | grep -i node || true

            echo "=== CHECKING CRONTAB ==="
            crontab -l || true

            # Delete all legacy PM2 processes to eliminate duplicate timers & auto-stop crons
            echo "=== PURGING PM2 INSTANCES ==="
            pm2 delete all 2>/dev/null || true
            pkill -9 -f "trackpro" 2>/dev/null || true
            pkill -9 -f "kisanconnect" 2>/dev/null || true
            pkill -9 -f "field-Backend-monitor-web" 2>/dev/null || true
            rm -rf ~/.pm2/dump.pm2 2>/dev/null || true

            echo "=== UPDATING MAIN CODEBASE ==="
            cd ~/field-Backend-both-monitor-app || cd ~/CRM-B || cd ~/field-App
            git fetch origin main
            git reset --hard origin/main
            npm install --omit=dev

            # Check if web monitor repo exists and update it too
            if [ -d ~/field-Backend-monitor-web ]; then
              echo "=== UPDATING field-Backend-monitor-web ==="
              cd ~/field-Backend-monitor-web
              git fetch origin main 2>/dev/null || true
              git reset --hard origin/main 2>/dev/null || true
              npm install --omit=dev 2>/dev/null || true
            fi

            echo "=== STARTING CLEAN SINGLE BACKEND ==="
            cd ~/field-Backend-both-monitor-app || cd ~/CRM-B || cd ~/field-App
            pm2 start server.js --name "field-App-backend"
            pm2 save --force

            echo "=== POST-DEPLOY VERIFICATION ==="
            pm2 list
            echo "✅ Deployment Successful!"
